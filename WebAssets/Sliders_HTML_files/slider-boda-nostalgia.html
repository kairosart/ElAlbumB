<script>
const wrap=document.getElementById('wrap'),aw=document.getElementById('aw'),dv=document.getElementById('div');
let on=false;
function mv(x){
  const r=wrap.getBoundingClientRect();
  let p=Math.min(Math.max((x-r.left)/r.width,0.02),0.98);
  aw.style.width=((1-p)*100).toFixed(2)+'%';
  dv.style.left=(p*100).toFixed(2)+'%';
}
wrap.addEventListener('mousedown',e=>{on=true;mv(e.clientX)});
window.addEventListener('mousemove',e=>{if(on)mv(e.clientX)});
window.addEventListener('mouseup',()=>on=false);
wrap.addEventListener('touchstart',e=>{on=true;mv(e.touches[0].clientX)},{passive:true});
window.addEventListener('touchmove',e=>{if(on)mv(e.touches[0].clientX)},{passive:true});
window.addEventListener('touchend',()=>on=false);
</script>
